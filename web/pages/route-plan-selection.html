<div class="page route-plan-selection">
  <div class="route-plan-banner">
    <h2>CIT Digital Twin Platform</h2>
    <p>Select a route plan to begin analysis</p>
  </div>

  <div class="card selector-card">
    <div class="form-group">
      <label for="operation-type-select">Operation Type</label>
      <select id="operation-type-select">
        <option value="waste-collection" selected>Waste Collection</option>
      </select>
    </div>

    <div class="form-group">
      <label for="route-plan-select">Route Plan</label>
      <select id="route-plan-select">
        <option value="zone-2b-day" selected>Zone 2 B (Day) - V 2.0</option>
      </select>
    </div>

    <div class="route-plan-description">
      <div class="detail-grid">
        <div class="detail-item">
          <span class="detail-label">Schedule</span>
          <span class="detail-value">Tue, Wed, Thu, Sat, Sun</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Service Points</span>
          <span class="detail-value">331 locations</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Vehicle</span>
          <span class="detail-value">REL-4</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Zone</span>
          <span class="detail-value">Albada Zone-2</span>
        </div>
      </div>
    </div>

    <button class="btn-primary btn-route-continue" onclick="continueToHome()">
      CONTINUE
    </button>
  </div>
</div>
