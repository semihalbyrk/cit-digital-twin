<div class="page home">
  <!-- KPI Summary Cards -->
  <div class="kpi-grid kpi-grid-6" id="home-kpi-grid">
    <!-- Populated by JavaScript -->
  </div>

  <!-- Route Instances Table -->
  <div class="card">
    <div class="card-header">
      <h2>Available Routes for This Week</h2>
      <span class="text-sm text-muted" id="home-route-count"></span>
    </div>

    <div class="table-container">
      <table id="home-routes-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Shift</th>
            <th class="numeric">Tasks</th>
            <th class="numeric">Done</th>
            <th class="numeric">Visited</th>
            <th class="numeric">To-Do</th>
            <th class="numeric">Distance</th>
            <th class="numeric">Time</th>
            <th class="numeric">Cost</th>
            <th class="numeric">CO2</th>
            <th>Status</th>
            <th class="col-actions">Action</th>
          </tr>
        </thead>
        <tbody id="home-routes-body">
          <!-- Populated by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>
</div>
